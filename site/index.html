<!DOCTYPE html>
<html lang="la">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="web_icon.png">
  <title>Is it Ablative?</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Aeneid<span class="subtitle"> Ablatives</span></h1>
    <nav id="nav">
      <button class="nav-btn active" data-view="reading">Text</button>
      <button class="nav-btn" data-view="quizA">Identify Abl.</button>
      <button class="nav-btn" data-view="quizB">Abl. Case</button>
      <button class="nav-btn" data-view="stats">Current Session</button>
    </nav>
  </header>

  <main>
    <section class="view" id="view-reading">
      <div id="section-picker" class="section-picker"></div>
      <div id="passage" class="passage"></div>
    </section>

    <section class="view hidden" id="view-quizA">
      <div class="quiz-hd">
        <span class="quiz-lbl">Is it ablative?</span>
      </div>
      <div id="quizA-content"></div>
    </section>

    <section class="view hidden" id="view-quizB">
      <div class="quiz-hd">
        <span class="quiz-lbl">What use of Ablative?</span>
      </div>
      <div id="quizB-content"></div>
    </section>

    <section class="view hidden" id="view-stats">
      <h2>Statistics</h2>
      <div id="stats-content"></div>
    </section>

  </main>

<script src="app.js"></script>
<footer id="attribution">Ablative data from <a href="https://nolatinbooks.blogspot.com/" target="_blank" rel="noopener">No Latin Books</a></footer>
</body>
</html>
