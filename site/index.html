<!DOCTYPE html>
<html lang="la">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latin Ablatives — Aeneid I</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <h1>Aeneid I<span class="subtitle"> — Ablatives</span></h1>
    <nav id="nav">
      <button class="nav-btn active" data-view="reading">Reading</button>
      <button class="nav-btn" data-view="quizA">Identify Abl.</button>
      <button class="nav-btn" data-view="quizB">Abl. Case</button>
      <button class="nav-btn" data-view="stats">Current Session</button>
    </nav>
  </header>

  <main>

    <!-- Reading view -->
    <section class="view" id="view-reading">
      <div class="controls">
        <label class="toggle">
          <input type="checkbox" id="hints-toggle" checked>
          <span>Show hints on tap</span>
        </label>
      </div>
      <div id="passage" class="passage"></div>
    </section>

    <!-- Quiz A -->
    <section class="view hidden" id="view-quizA">
      <div class="quiz-hd">
        <span class="quiz-lbl">Quiz A — Is it ablative?</span>
        <span id="streak-A" class="streak">Streak: 0</span>
      </div>
      <div id="quizA-content"></div>
    </section>

    <!-- Quiz B -->
    <section class="view hidden" id="view-quizB">
      <div class="quiz-hd">
        <span class="quiz-lbl">Quiz B — What use?</span>
        <span id="streak-B" class="streak">Streak: 0</span>
      </div>
      <div id="quizB-content"></div>
    </section>

    <!-- Stats -->
    <section class="view hidden" id="view-stats">
      <h2>Statistics</h2>
      <div id="stats-content"></div>
    </section>

  </main>

  <!-- Word info tooltip (fixed bottom panel) -->
  <div id="tip" class="tip" hidden>
    <button id="tip-close" class="tip-close" aria-label="Close">×</button>
    <div class="tip-dict"></div>
    <div class="tip-en"></div>
    <div class="tip-note"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
